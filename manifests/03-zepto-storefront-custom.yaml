apiVersion: v1
kind: ConfigMap
metadata:
  name: zepto-storefront-html
  labels:
    app: zepto-storefront
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Zepto 10-Minute Delivery | Kubernetes Exercise 1</title>
      <style>
        :root {
          --primary: #9b1fe8;
          --primary-dark: #6a00a8;
          --accent: #ff3269;
          --bg: #0f0c20;
          --card-bg: rgba(26, 21, 51, 0.85);
          --text: #ffffff;
          --text-muted: #a39eb8;
          --success: #00d26a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body {
          background: radial-gradient(circle at 20% 20%, #2e1065, #0a0618 80%);
          color: var(--text);
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          padding: 2rem 1rem;
        }
        .header {
          text-align: center;
          margin-bottom: 2rem;
        }
        .logo-badge {
          display: inline-block;
          background: linear-gradient(135deg, var(--accent), var(--primary));
          color: white;
          font-weight: 800;
          font-size: 1.5rem;
          padding: 0.5rem 1.25rem;
          border-radius: 9999px;
          box-shadow: 0 8px 24px rgba(155, 31, 232, 0.4);
          margin-bottom: 0.75rem;
        }
        .title { font-size: 2.2rem; font-weight: 800; }
        .subtitle { color: var(--text-muted); margin-top: 0.5rem; font-size: 1.1rem; }
        .grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
          gap: 1.5rem;
          max-width: 900px;
          width: 100%;
        }
        .card {
          background: var(--card-bg);
          border: 1px solid rgba(255, 255, 255, 0.1);
          border-radius: 16px;
          padding: 1.75rem;
          backdrop-filter: blur(12px);
          box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
        }
        .card h3 { font-size: 1.3rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
        .status-badge {
          background: rgba(0, 210, 106, 0.15);
          color: var(--success);
          padding: 0.25rem 0.75rem;
          border-radius: 9999px;
          font-size: 0.85rem;
          font-weight: 600;
          display: inline-flex;
          align-items: center;
          gap: 0.4rem;
        }
        .pulse-dot {
          width: 8px;
          height: 8px;
          background-color: var(--success);
          border-radius: 50%;
          display: inline-block;
          animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.3); } }
        .info-row { display: flex; justify-content: space-between; padding: 0.6rem 0; border-bottom: 1px solid rgba(255, 255, 255, 0.08); font-size: 0.95rem; }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: var(--text-muted); }
        .info-value { font-weight: 600; }
        .footer {
          margin-top: 2.5rem;
          text-align: center;
          color: var(--text-muted);
          font-size: 0.85rem;
        }
      </style>
    </head>
    <body>
      <div class="header">
        <div class="logo-badge">⚡ Zepto Storefront</div>
        <h1 class="title">Kubernetes Exercise 1: Hello Pod</h1>
        <p class="subtitle">Cloud Native Storefront & Delivery Status Simulation</p>
      </div>
      <div class="grid">
        <div class="card">
          <h3>📦 Active Order Status</h3>
          <div style="margin-bottom: 1rem;">
            <span class="status-badge"><span class="pulse-dot"></span> Delivery in 7 Mins</span>
          </div>
          <div class="info-row"><span class="info-label">Order ID:</span><span class="info-value">#ZP-98241</span></div>
          <div class="info-row"><span class="info-label">Items:</span><span class="info-value">Farm Fresh Milk, Organic Bananas</span></div>
          <div class="info-row"><span class="info-label">Rider:</span><span class="info-value">Kiran M. (Near delivery hub)</span></div>
          <div class="info-row"><span class="info-label">Status:</span><span class="info-value">Out for Delivery 🚀</span></div>
        </div>
        <div class="card">
          <h3>☸️ K8s Cluster Architecture</h3>
          <div style="margin-bottom: 1rem;">
            <span class="status-badge"><span class="pulse-dot"></span> Pod Running Healthy</span>
          </div>
          <div class="info-row"><span class="info-label">Pod Name:</span><span class="info-value">hello-k8s</span></div>
          <div class="info-row"><span class="info-label">Container Image:</span><span class="info-value">nginx:latest</span></div>
          <div class="info-row"><span class="info-label">Target Port:</span><span class="info-value">80 (HTTP)</span></div>
          <div class="info-row"><span class="info-label">Service Type:</span><span class="info-value">NodePort</span></div>
        </div>
      </div>
      <div class="footer">
        Zepto DevOps Engineering Series • Deployed inside local Kubernetes Cluster via Minikube
      </div>
    </body>
    </html>
---
apiVersion: v1
kind: Pod
metadata:
  name: zepto-custom-pod
  labels:
    app: zepto-storefront
    tier: custom-frontend
spec:
  containers:
    - name: nginx
      image: nginx:latest
      ports:
        - containerPort: 80
      volumeMounts:
        - name: html-volume
          mountPath: /usr/share/nginx/html
  volumes:
    - name: html-volume
      configMap:
        name: zepto-storefront-html
